<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Wowser</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html, body {
        margin: 0;
        height: 100%;
      }

      body {
        background: black;
        /* Centre the viewport, and letterbox it rather than letting it overflow. */
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      .container {
        position: relative;
        /* The UI is authored for 4:3 and the layout engine assumes it, so keep that
           ratio - but fit inside the window instead of forcing the width and spilling
           off the top and bottom on anything shorter. */
        aspect-ratio: 4 / 3;
        width: min(100vw, calc(100vh * 4 / 3));
        height: min(100vh, calc(100vw * 3 / 4));
        background-image:
          linear-gradient(45deg, #222 25%, transparent 25%),
          linear-gradient(-45deg, #222 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #222 75%),
          linear-gradient(-45deg, transparent 75%, #222 75%);
        background-size: 20px 20px;
        background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
      }

      canvas {
        position: absolute;
        top: 0;
        left: 0;
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <canvas></canvas>
    </div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
